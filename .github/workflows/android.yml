# SeeTuned Android app (vision-app/android): unit tests, lint and the APK, then the on-device tests on
# Android emulators. The debug APK is attached to every run (Summary → Artifacts → seetuned-android-debug).
name: android

on:
  push:
    branches: [claude/vision-adaptive-screen-app-cuf6rg]
    paths:
      - vision-app/android/**
      - vision-app/public/app/js/render/filter-math.js
      - vision-app/public/app/js/engine/android-link.js
      - vision-app/scripts/android/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vision-app/android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, APKs
        run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Lint findings
        if: always()
        run: cat app/build/reports/lint-results.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: seetuned-android-debug
          path: vision-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            vision-app/android/app/build/reports/
            vision-app/android/core/build/reports/
            vision-app/android/core/build/test-results/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On-device tests (Android API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          working-directory: vision-app/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest; s=$?; adb logcat -d -s SeeTunedProbe:I > probe.txt; adb logcat -d > logcat.txt; cat probe.txt; exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-api-${{ matrix.api }}
          path: |
            vision-app/android/app/build/reports/androidTests/
            vision-app/android/app/build/outputs/androidTest-results/
            vision-app/android/probe.txt
            vision-app/android/logcat.txt
